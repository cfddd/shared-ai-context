[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shared-ai-context"
version = "0.2.0"
description = "Explicit local context sharing between coding agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
sctx = "shared_ai_context.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
